manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: ghetdeg
      url-base: https://github.com/ghetdeg
  projects:
    - name: eyelash_corne
      url: https://github.com/a741725193/zmk-new_corne
      revision: main
    - name: zmk
      remote: zmkfirmware
      # Pin the revision so upstream changes cannot unexpectedly break builds.
      # This commit predates the last successful firmware build in this repo.
      revision: f9be3ed9c08b35b1b86df24c0f04913f3b5e50f5
      import: app/west.yml
    - name: hammerbeam-slideshow
      remote: ghetdeg
      revision: main
  self:
    path: config
